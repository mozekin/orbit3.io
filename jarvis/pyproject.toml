[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "1.0.0"
description = "Project J.A.R.V.I.S. - a personal voice assistant for Mr. Martin Ozekin"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "rich>=13.0",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
google = [
  "google-auth>=2.23",
  "google-auth-oauthlib>=1.1",
  "google-api-python-client>=2.100",
]
dev = ["pytest>=7.4"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["../mock_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
