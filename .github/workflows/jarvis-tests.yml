# Runs the J.A.R.V.I.S. unit tests whenever the assistant's code changes.
name: J.A.R.V.I.S. tests

on:
  push:
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-tests.yml"
  pull_request:
    paths:
      - "jarvis/**"
      - ".github/workflows/jarvis-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jarvis
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: jarvis/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Smoke-test mock mode
        run: |
          python -m jarvis --mock --no-anim --no-voice
          python -m jarvis --mock --json > /dev/null
